<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C5A059">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>📋 Trade Full Report — ISI v6.0</title>
<script src="session.js"></script>
<script>
    // Protected page — same guard pattern as Terminal: no Daybook auth, no entry.
    (function(){
        if (!window._ISISession || !window._ISISession.isActive()) {
            window.location.replace('index.html');
        }
    })();
</script>
<script>
    (function(){
        const t = localStorage.getItem('isi_theme') || 'dark';
        if (t === 'light') document.documentElement.classList.add('light-mode-pending');
    })();
</script>
<style>html.light-mode-pending{background:#f5f5f7;}</style>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

<style>
.tr-header{
    position:sticky; top:0; z-index:100; background:#000; border-bottom:2px solid var(--gold);
    padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px;
}
body.light-mode .tr-header{ background:#fff; }
.tr-back{ background:#222; color:#aaa; border:1px solid #444; padding:8px 14px; border-radius:4px; cursor:pointer; font-size:0.72rem; width:auto; text-decoration:none; }
.tr-title{ color:var(--gold); font-size:0.85rem; font-weight:900; letter-spacing:1px; }
.tr-pl{ font-size:1.1rem; font-weight:900; font-family:monospace; }

.tr-wrap{ max-width:1100px; margin:0 auto; padding:16px; }
.tr-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; margin-bottom:12px; }
.tr-pane{
    background:#0a0a0a; border:1px solid #1a1a1a; border-radius:8px; padding:14px;
    border-left:4px solid var(--gold);
}
body.light-mode .tr-pane{ background:#fafafa; }
.tr-pane h3{ margin:0 0 10px 0; font-size:0.78rem; color:var(--gold); letter-spacing:1px; text-transform:uppercase; }
.tr-pane p{ font-size:0.8rem; margin:4px 0; }

/* MFE/MAE reversal matrix bar */
.mm-bar-wrap{ position:relative; height:44px; background:#000; border-radius:6px; overflow:hidden; border:1px solid #222; }
.mm-bar-mid{ position:absolute; left:50%; top:0; bottom:0; width:2px; background:#444; }
.mm-bar-fill{ position:absolute; top:6px; bottom:6px; border-radius:4px; }
.mm-label{ display:flex; justify-content:space-between; font-size:0.6rem; color:#666; margin-top:6px; }

.tr-tag{ display:inline-block; padding:3px 9px; margin:2px 4px 2px 0; border-radius:4px; font-size:0.65rem; border:1px solid #444; }
.tr-tag.red{ border-color:var(--danger); color:var(--danger); }
.tr-tag.green{ border-color:var(--accent); color:var(--accent); }

.tr-screenshot{ width:100%; border-radius:8px; border:1px solid #222; margin-top:8px; }
.tr-pdf-btn{ width:100%; background:var(--gold); color:#000; padding:13px; font-weight:bold; margin-top:6px; border:none; border-radius:6px; cursor:pointer; font-size:0.9rem; }
.tr-empty{ text-align:center; color:#555; padding:40px 0; }
</style>
</head>
<body>

<div class="tr-header">
    <button class="tr-back" onclick="history.back()">← Back to Monitoring</button>
    <div class="tr-title" id="trTitle">Loading report…</div>
    <div class="tr-pl" id="trPl">—</div>
</div>

<div class="tr-wrap" id="trBody">
    <div class="tr-empty">Fetching trade record…</div>
</div>

<script type="module" src="trade-report.js"></script>
</body>
</html>
